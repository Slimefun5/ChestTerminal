# French item translations for ChestTerminal. Keyed by Slimefun item id.
# name = display name, lore = list of lines, '&' colour codes. Missing items fall back to English.

MILKY_QUARTZ:
  name: "&fQuartz laiteux"

CT_PANEL:
  name: "&3Panneau illuminé CT"
  lore:
    - "&7Composant de fabrication"

CHEST_TERMINAL:
  name: "&3Terminal d'accès CT"
  lore:
    - "&7Si ce bloc est connecté à un"
    - "&7réseau de fret, il vous permet d'interagir"
    - "&7à distance avec tous les objets fournis par"
    - "&7les nœuds réglés sur le canal ChestTerminal"

CT_IMPORT_BUS:
  name: "&3Bus d'importation CT"
  lore:
    - "&7Si ce bloc est connecté à un"
    - "&7réseau de fret, il extrait les objets de"
    - "&7l'inventaire auquel il est attaché et les place"
    - "&7dans le canal du réseau CT"

CT_EXPORT_BUS:
  name: "&3Bus d'exportation CT"
  lore:
    - "&7Si ce bloc est connecté à un"
    - "&7réseau de fret, il extrait les objets du"
    - "&7canal du réseau CT et les place"
    - "&7dans l'inventaire auquel il est attaché"
